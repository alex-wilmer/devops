name: Deploy API Ephemeral

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: express-app-repo

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin 724772081910.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker image
        working-directory: ./api
        run: docker build -t $ECR_REPOSITORY .

      - name: Tag Docker image
        run: |
          PR_ID=${{ github.event.pull_request.number }}
          IMAGE_TAG=${ECR_REPOSITORY}:pr-${PR_ID}
          docker tag $ECR_REPOSITORY:latest 724772081910.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_TAG

      - name: Push Docker image to ECR
        run: |
          PR_ID=${{ github.event.pull_request.number }}
          IMAGE_TAG=${ECR_REPOSITORY}:pr-${PR_ID}
          docker push 724772081910.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_TAG

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve -var="docker_image=724772081910.dkr.ecr.$AWS_REGION.amazonaws.com/${{ env.ECR_REPOSITORY }}:pr-${{ github.event.pull_request.number }}"
